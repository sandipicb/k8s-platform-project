name: Validate Kubernetes Manifests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate YAML and Kubernetes Schemas
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install YAML validator
        run: pip install yamllint

      - name: Lint Kubernetes manifests
        run: yamllint -d relaxed k8s/base/

      - name: Set up kubeconform
        uses: bmuschko/setup-kubeconform@v1

      - name: Validate Kubernetes schemas
        run: kubeconform -strict -summary -kubernetes-version 1.32.0 k8s/base/

  deploy:
    name: Deploy to GKE
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/781699136096/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: github-deployer@sandip-k8s-platform.iam.gserviceaccount.com

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: k8s-learning-cluster
          location: asia-south1-a
          project_id: sandip-k8s-platform

      - name: Deploy Kubernetes manifests
        run: kubectl apply -f k8s/base/

      - name: Verify deployment rollout
        run: kubectl rollout status deployment/nginx-web --namespace=app-dev --timeout=120s

      - name: Check deployed resources
        run: kubectl get deployments,services -n app-dev
